<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" height="100%">
  <defs>
    <style>
      .kicker { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #888888; letter-spacing: 0.15em; text-transform: uppercase; }
      .header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 24px; font-weight: 400; fill: #111111; letter-spacing: -0.02em; }
      .axis-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 400; fill: #777777; }
      .year-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #111111; letter-spacing: -0.01em; }
      .stat-val { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 42px; font-weight: 600; fill: #111111; letter-spacing: -0.04em; }
      .stat-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 400; fill: #555555; line-height: 1.6; }
      .source { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 400; fill: #999999; letter-spacing: 0.1em; text-transform: uppercase; }
    </style>

    <!-- Subtle Area Fill Gradient -->
    <linearGradient id="areaGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.00" />
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Clean Minimal Container Background -->
  <rect width="1200" height="640" fill="#FBFBFB" rx="0" stroke="#EAEAEA" stroke-width="1" />

  <!-- Header Block -->
  <text x="70" y="70" class="kicker">Market Dynamics</text>
  <text x="70" y="102" class="header">Global Facial Steaming Device Growth</text>

  <!-- Y-Axis Unit -->
  <text x="70" y="155" class="axis-label">Market Size ($B)</text>

  <!-- Horizontal Grid Lines & Y-Axis Scale -->
  <!-- 1.3 B -->
  <line x1="70" y1="180" x2="1130" y2="180" stroke="#EBEBEB" stroke-width="1" />
  <text x="1130" y="172" class="axis-label" text-anchor="end">$1.3B</text>

  <!-- 1.2 B -->
  <line x1="70" y1="260" x2="1130" y2="260" stroke="#EBEBEB" stroke-width="1" />
  <text x="1130" y="252" class="axis-label" text-anchor="end">$1.2B</text>

  <!-- 1.0 B -->
  <line x1="70" y1="360" x2="1130" y2="360" stroke="#EBEBEB" stroke-width="1" />
  <text x="1130" y="352" class="axis-label" text-anchor="end">$1.0B</text>

  <!-- 0.8 B -->
  <line x1="70" y1="460" x2="1130" y2="460" stroke="#EBEBEB" stroke-width="1" />
  <text x="1130" y="452" class="axis-label" text-anchor="end">$0.8B</text>

  <!-- X-Axis Baseline -->
  <line x1="70" y1="520" x2="1130" y2="520" stroke="#111111" stroke-width="1.5" />

  <!-- X-Axis Ticks & Year Labels -->
  <!-- 2025 -->
  <line x1="120" y1="520" x2="120" y2="528" stroke="#111111" stroke-width="1.5" />
  <text x="120" y="555" class="year-label" text-anchor="middle">2025</text>
  <text x="120" y="575" class="axis-label" text-anchor="middle">~$0.78B</text>

  <!-- 2032 -->
  <line x1="1080" y1="520" x2="1080" y2="528" stroke="#111111" stroke-width="1.5" />
  <text x="1080" y="555" class="year-label" text-anchor="middle">2032</text>
  <text x="1080" y="575" class="axis-label" text-anchor="middle">~$1.28B</text>

  <!-- Shaded Area Under Curve -->
  <polygon points="120,470 1080,190 1080,520 120,520" fill="url(#areaGradient)" />

  <!-- Main Growth Trend Line (Sleek Minimalist Curve) -->
  <line x1="120" y1="470" x2="1080" y2="190" stroke="#111111" stroke-width="2.5" stroke-linecap="round" />

  <!-- Data Point Nodes -->
  <circle cx="120" cy="470" r="5" fill="#FFFFFF" stroke="#111111" stroke-width="2.5" />
  <circle cx="1080" cy="190" r="5" fill="#FFFFFF" stroke="#111111" stroke-width="2.5" />

  <!-- Floating Editorial Callout Card -->
  <g transform="translate(500, 240)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="360" height="150" rx="4" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1" />
    
    <!-- Accent Bar -->
    <rect x="0" y="0" width="4" height="150" fill="#111111" rx="2" />
    
    <g transform="translate(32, 36)">
      <text x="0" y="24" class="stat-val">+62.5%</text>
      <text x="0" y="56" class="stat-desc">
        Expected market expansion between
      </text>
      <text x="0" y="76" class="stat-desc">
        2025–2032 driven by at-home skincare demand.
      </text>
    </g>
  </g>

  <!-- Source Footer -->
  <text x="70" y="608" class="source">Source: Industry Market Analysis &amp; Forecast (2025–2032)</text>
</svg>